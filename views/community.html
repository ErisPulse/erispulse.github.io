<div id="community-view" class="view-container">
    <section class="community-section">
        <div class="community-container">
            <!-- 社区横幅 -->
            <header class="community-hero">
                <div class="community-hero-text">
                    <h2 class="community-title" data-i18n="community.title">社区</h2>
                    <p class="community-subtitle" data-i18n="community.subtitle">交流经验 · 分享创意 · 反馈问题</p>
                </div>
                <div class="community-header-actions">
                    <span class="community-source-badge" id="community-source-badge" style="display:none;"></span>
                    <a
                        class="btn community-btn-ghost"
                        href="https://github.com/ErisPulse/ErisPulse/discussions"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <i class="fab fa-github"></i>
                        <span data-i18n="community.githubDiscussions">GitHub 讨论区</span>
                    </a>
                    <button class="btn community-btn-primary" id="community-new-btn">
                        <i class="fas fa-plus"></i>
                        <span data-i18n="community.newDiscussion">发起新讨论</span>
                    </button>
                </div>
            </header>

            <!-- 论坛版块（点击筛选） -->
            <div class="community-boards" id="community-boards"></div>

            <div class="community-list-head">
                <h3 class="community-list-title" data-i18n="community.latest">最新讨论</h3>
            </div>

            <div class="community-list" id="community-list">
                <div class="community-state community-loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span data-i18n="community.loading">加载中...</span>
                </div>
            </div>

            <div class="community-load-more-wrap" id="community-load-more-wrap" style="display:none;">
                <button class="btn community-btn-ghost" id="community-load-more-btn">
                    <span data-i18n="community.loadMore">加载更多</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
            </div>
        </div>
    </section>

    <!-- 讨论详情弹窗 -->
    <div class="community-overlay" id="community-detail-overlay" aria-hidden="true">
        <div class="community-modal community-detail-modal" role="dialog" aria-modal="true">
            <div class="community-modal-header">
                <h3 class="community-modal-title" data-i18n="community.detail.title">讨论详情</h3>
                <button class="community-close-btn" id="community-detail-close" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="community-modal-body" id="community-detail-body">
                <div class="community-state community-loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span data-i18n="community.loading">加载中...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 发起新讨论弹窗 -->
    <div class="community-overlay" id="community-create-overlay" aria-hidden="true">
        <div class="community-modal community-create-modal" role="dialog" aria-modal="true">
            <div class="community-modal-header">
                <h3 class="community-modal-title" data-i18n="community.create.title">发起新讨论</h3>
                <button class="community-close-btn" id="community-create-close" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="community-modal-body">
                <!-- 未登录状态 -->
                <div id="community-create-login" class="community-create-login">
                    <div class="community-login-icon">
                        <i class="fab fa-github"></i>
                    </div>
                    <h4 data-i18n="community.create.loginTitle">使用 GitHub 账号参与讨论</h4>
                    <p data-i18n="community.create.loginDesc">
                        讨论基于 GitHub Discussions，登录后可直接在官网发帖和回帖
                    </p>
                    <button class="btn community-btn-primary" id="community-create-login-btn">
                        <i class="fab fa-github"></i> <span>GitHub</span>
                    </button>
                </div>

                <!-- 已登录表单 -->
                <form id="community-create-form" class="community-create-form" style="display:none;">
                    <div class="community-form-user" id="community-form-user"></div>
                    <div class="community-form-group">
                        <label data-i18n="community.create.category">分类</label>
                        <select id="community-create-category" class="community-select" required></select>
                    </div>
                    <div class="community-form-group">
                        <label data-i18n="community.create.titleLabel">标题</label>
                        <input
                            type="text"
                            id="community-create-title"
                            class="community-input"
                            maxlength="200"
                            minlength="3"
                            required
                            data-i18n-placeholder="community.create.titlePlaceholder"
                            placeholder="一句话说清你的主题"
                        />
                    </div>
                    <div class="community-form-group">
                        <label data-i18n="community.create.bodyLabel">正文（支持 Markdown）</label>
                        <textarea
                            id="community-create-body"
                            class="community-textarea"
                            rows="8"
                            maxlength="20000"
                            required
                            data-i18n-placeholder="community.create.bodyPlaceholder"
                            placeholder="描述你的问题、想法或分享的内容..."
                        ></textarea>
                    </div>
                    <p class="community-form-error" id="community-create-error" style="display:none;"></p>
                    <div class="community-form-actions">
                        <button type="submit" class="btn community-btn-primary" id="community-create-submit">
                            <i class="fas fa-paper-plane"></i>
                            <span data-i18n="community.create.submit">发布</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

        <div id="market-view" class="view-container">
            <div class="container market-container">
                <div class="market-header">
                    <h2 class="section-title" data-i18n="market.title">模块市场</h2>
                    <div class="search-container">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" class="search-input" id="module-search" data-i18n-placeholder="market.search" placeholder="搜索模块...">
                    </div>
                </div>

                <!-- 模块市场统计信息 -->
                <div class="market-stats">
                    <div class="stats-grid">
                        <div class="stat-card stat-card-highlight">
                            <div class="stat-number" id="total-all-modules">--</div>
                            <div class="stat-label" data-i18n="market.total">总模块数</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number" id="total-modules">--</div>
                            <div class="stat-label" data-i18n="market.modules">功能模块</div>
                        </div>

                        <div class="stat-card">
                            <div class="stat-number" id="adapter-count">--</div>
                            <div class="stat-label" data-i18n="market.adapters">平台适配器</div>
                        </div>

                        <div class="stat-card is-hidden" id="cli-stat-card">
                            <div class="stat-number" id="cli-count">--</div>
                            <div class="stat-label" data-i18n="market.cli">CLI 扩展</div>
                        </div>
                    </div>
                </div>

                <div class="module-categories">
                    <button class="category-btn active" data-category="all" data-i18n="market.all">全部模块</button>
                    <button class="category-btn" data-category="modules" data-i18n="market.modules">功能模块</button>
                    <button class="category-btn" data-category="adapters" data-i18n="market.adapters">平台适配器</button>
                    <button class="category-btn is-hidden" data-category="cli_extensions" id="category-cli-btn" data-i18n="market.cli">CLI 扩展</button>
                    <button class="submit-module-link" id="submit-module-btn">
                        <i class="fas fa-plus"></i> <span data-i18n="market.submit">提交模块</span>
                    </button>
                </div>

                <!-- 筛选面板 -->
                <div class="market-filters" id="market-filters">
                    <div class="filter-row">
                        <span class="filter-label" data-i18n="market.filter.quick">快速筛选</span>
                        <div class="filter-chips" id="market-flag-filters">
                            <button type="button" class="filter-chip" data-flag="featured">
                                <i class="fas fa-star"></i> <span data-i18n="market.filter.featured">推荐</span>
                            </button>
                            <button type="button" class="filter-chip" data-flag="official">
                                <i class="fas fa-check-circle"></i> <span data-i18n="market.filter.official">官方</span>
                            </button>
                            <button type="button" class="filter-chip" data-flag="verified">
                                <i class="fas fa-shield-alt"></i> <span data-i18n="market.filter.verified">已验证</span>
                            </button>
                            <button type="button" class="filter-chip" data-flag="unverified">
                                <i class="fas fa-exclamation-triangle"></i> <span data-i18n="market.filter.unverified">未验证</span>
                            </button>
                        </div>
                    </div>

                    <!-- 分类：受控字段（后端存编号，按钮文字按当前语言渲染） -->
                    <div class="filter-row is-hidden" id="market-category-row">
                        <span class="filter-label" data-i18n="market.filter.category">分类</span>
                        <div class="filter-tags" id="market-category-filters"></div>
                    </div>

                    <div class="filter-row is-hidden" id="market-tag-row">
                        <span class="filter-label" data-i18n="market.filter.tags">标签</span>
                        <div class="filter-tags" id="market-tag-filters"></div>
                    </div>

                    <div class="filter-row">
                        <span class="filter-label" data-i18n="market.filter.sdk">我的 SDK 版本</span>
                        <select class="filter-select" id="market-sdk-select" data-i18n-title="market.filter.sdk.hint"></select>
                        <span class="filter-label" data-i18n="market.filter.sort">排序</span>
                        <select class="filter-select" id="market-sort-select"></select>
                        <button type="button" class="filter-reset is-hidden" id="market-filter-reset">
                            <i class="fas fa-times-circle"></i> <span data-i18n="market.filter.reset">清除筛选</span>
                        </button>
                    </div>
                </div>

                <div class="filter-summary" id="market-summary"></div>

                <div class="module-grid" id="modules-grid">
                    <!-- 模块卡片将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>

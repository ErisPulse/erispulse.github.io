<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>ErisPulse - 页面重定向中</title>
        <script>
            /*
             * GitHub Pages 404 兜底：
             *  - /api-reference/event-system.md#章节 等 GitHub 风格文档深链
             *    → 跳转站内文档路由（?md= 落点由 app.js 归一化为 #docs/...#章节，
             *      浏览器会自动保留原始 fragment）
             *  - 其他未知路径 → 回首页
             */
            (function () {
                var p = location.pathname.replace(/^\/+/, "");
                if (/\.(md|markdown)$/i.test(p)) {
                    location.replace("/?md=" + p);
                } else {
                    location.replace("/");
                }
            })();
        </script>
    </head>
    <body></body>
</html>

        <!-- 主题预应用：主样式表加载前就确定明暗，避免加载页闪白/闪黑 -->
        <script>
            (function () {
                try {
                    var s = JSON.parse(localStorage.getItem("erispulse-settings") || "{}");
                    var t = s.theme === "dark" || s.theme === "light"
                        ? s.theme
                        : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
                    document.documentElement.dataset.theme = t;
                } catch (e) {}
            })();
        </script>
        <!-- 加载动画关键样式：内联保证第一时间呈现，不等待外部 CSS -->
        <style>
            #page-loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:26px;background:radial-gradient(circle at 50% 42%,rgba(79,166,222,.07),transparent 55%),#F4F7FB}
            [data-theme="dark"] #page-loader{background:radial-gradient(circle at 50% 42%,rgba(98,181,230,.08),transparent 55%),#0E141B}
            .loader-logo-wrap{position:relative;width:104px;height:104px;display:flex;align-items:center;justify-content:center}
            .loader-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(79,166,222,0) 0 55%,rgba(79,166,222,.85) 94%,rgba(79,166,222,.15) 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3.5px));animation:loaderSpin 1.1s cubic-bezier(.6,.15,.4,.85) infinite}
            .loader-ring::after{content:"";position:absolute;inset:9px;border-radius:50%;border:1px solid rgba(79,166,222,.18)}
            @keyframes loaderSpin{to{transform:rotate(360deg)}}
            .loader-logo-text{position:absolute;z-index:0;font-size:2.3rem;font-weight:800;letter-spacing:-2px;user-select:none;background:linear-gradient(135deg,#4FA6DE,rgba(79,166,222,.55));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
            .loader-icon{position:relative;z-index:1;height:104px;width:104px;border-radius:50%;object-fit:contain;opacity:0;transition:opacity .4s ease}
            .loader-icon.loaded{opacity:1}
            .loader-brand{display:flex;align-items:center;font-size:.9rem;font-weight:600;letter-spacing:.35em;text-indent:.35em;text-transform:uppercase;color:#5A6C7D;opacity:.85;user-select:none}
            [data-theme="dark"] .loader-brand{color:#A0B0C0}
            .loader-dots{display:inline-flex;gap:4px;margin-left:4px;text-indent:0}
            .loader-dots i{width:4px;height:4px;border-radius:50%;background:rgba(79,166,222,.85);animation:loaderDot 1.2s ease-in-out infinite}
            .loader-dots i:nth-child(2){animation-delay:.15s}
            .loader-dots i:nth-child(3){animation-delay:.3s}
            @keyframes loaderDot{0%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
        </style>
